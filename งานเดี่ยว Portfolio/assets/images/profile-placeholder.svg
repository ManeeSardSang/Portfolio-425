<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1210" />
      <stop offset="50%" stop-color="#0f261e" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)" />
  <circle cx="250" cy="200" r="160" fill="#00F59B" opacity="0.06" filter="url(#glow)" />

  <!-- Geometric rings -->
  <circle cx="250" cy="210" r="125" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="250" cy="210" r="105" fill="#111827" stroke="#00F59B" stroke-width="1.5" opacity="0.9" />

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="250" cy="180" r="48" fill="#1f2937" stroke="#00F59B" stroke-width="2"/>
  <!-- Body / Shoulders -->
  <path d="M 180 290 Q 250 250 320 290 C 330 330 310 350 250 350 C 190 350 170 330 180 290 Z" fill="#1f2937" stroke="#00F59B" stroke-width="2" />
  <!-- Stylish Visor / Glasses / Headphone accent -->
  <rect x="220" y="170" width="60" height="12" rx="6" fill="#00F59B" filter="url(#glow)"/>

  <!-- Badge / Placeholder Text -->
  <rect x="130" y="400" width="240" height="42" rx="21" fill="#0c1815" stroke="#00F59B" stroke-width="1.5" />
  <text x="250" y="426" text-anchor="middle" fill="#00F59B" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="2">NITIPAT S. (AUTO)</text>
</svg>
